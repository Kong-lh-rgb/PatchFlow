packages:
  - 'apps/*'
  - 'packages/*'

# 允许运行安装脚本的依赖（pnpm 11 安全机制）：
# esbuild 需要下载平台二进制；msgpackr-extract 是 BullMQ 的原生解析加速组件。
allowBuilds:
  esbuild: true
  msgpackr-extract: true

# 统一版本目录：所有 workspace 包通过 "catalog:" 引用，
# 保证 TypeScript、Zod、Vitest 等跨包依赖版本完全一致。
catalog:
  typescript: '5.9.3'
  vitest: '4.1.11'
  tsx: '4.23.13'
  tsup: '8.5.1'
  zod: '4.5.4'
  pino: '10.3.1'
  pino-pretty: '13.1.3'
  ioredis: '6.0.0'
  pg: '8.23.0'
  '@types/pg': '8.23.1'
  '@types/node': '24.13.3'
  fastify: '5.12.1'
  bullmq: '6.3.2'
  drizzle-orm: '0.45.2'
  drizzle-kit: '0.31.10'
